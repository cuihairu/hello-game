name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Pages
        timeout-minutes: 3
        uses: actions/configure-pages@v5

      - name: Install mdBook
        timeout-minutes: 5
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build book
        timeout-minutes: 10
        run: mdbook build

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v4
